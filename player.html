
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/iansui@5.2.7/index.css" rel="stylesheet">

<style>
:root {
  --primary: #493B31;
  --background: #F1EFEE;
  --secondary: #CEC3BA;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow: hidden;
  background: transparent;
}

.wedding-player {
  max-width: 620px;
  width: 100%;
  margin: 0 auto;
  padding: 6px 8px 10px;
  text-align: center;
  color: var(--primary);
}

.eyebrow {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 14px;
}

.music-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  background: var(--background);
  border: 1px solid var(--secondary);
  border-radius: 12px;
}

.play-btn {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  background: var(--primary);
  color: var(--background);
  font-size: 18px;
  cursor: pointer;
}

.music-content {
  flex: 1;
  min-width: 0;
  text-align: left;
}

.song-title {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.45;
  margin-bottom: 5px;
}

.song-subtitle {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 12px;
  line-height: 1.5;
  opacity: 0.75;
  margin-bottom: 12px;
  overflow-wrap: break-word;
}

.progress {
  display: block;
  width: 100%;
  margin: 0;
  accent-color: var(--primary);
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 11px;
  opacity: 0.75;
  margin-top: 4px;
}

.hint {
  margin-top: 14px;
  font-family: "iansui", sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  line-height: 1.7;
}

@media (max-width: 480px) {
  .wedding-player {
    padding: 4px 5px 8px;
  }

  .eyebrow {
    font-size: 11px;
    margin-bottom: 10px;
  }

  .music-card {
    padding: 12px 10px;
    gap: 10px;
  }

  .play-btn {
    width: 40px;
    height: 40px;
  }

  .song-title {
    font-size: 13px;
  }

  .song-subtitle {
    font-size: 10px;
    margin-bottom: 8px;
  }

  .hint {
    font-size: 12px;
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<div class="wedding-player">

  <div class="eyebrow">
    A SONG FOR OUR JOURNEY
  </div>

  <div class="music-card">

    <button id="playBtn" class="play-btn"
      type="button" aria-label="播放音樂">▶</button>

    <div class="music-content">

      <div class="song-title">
        4 Lieder, Op. 27: IV. Morgen!
      </div>

      <div class="song-subtitle">
        James Ehnes · Andrew Armstrong · Richard Strauss
      </div>

      <input id="progress" class="progress"
        type="range" min="0" max="100"
        value="0" aria-label="音樂播放進度">

      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

    </div>
  </div>

  <div id="status" class="hint">
    輕點播放，搭配觀看我們的故事
  </div>

  <audio id="music" preload="metadata"></audio>

</div>

<script>
const audio = document.getElementById("music");
const btn = document.getElementById("playBtn");
const bar = document.getElementById("progress");
const current = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const status = document.getElementById("status");

audio.src =
  "https://vivianshen22.github.io/wedding-music/our-wedding-song.mp3";

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ":" + String(s).padStart(2, "0");
}

btn.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      status.textContent = "音樂無法播放，請稍後再試。";
    }
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  btn.textContent = "Ⅱ";
  btn.setAttribute("aria-label", "暫停音樂");
});

audio.addEventListener("pause", () => {
  btn.textContent = "▶";
  btn.setAttribute("aria-label", "播放音樂");
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  current.textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    bar.value = audio.currentTime / audio.duration * 100;
  }
});

bar.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = bar.value / 100 * audio.duration;
  }
});

audio.addEventListener("ended", () => {
  bar.value = 0;
});

audio.addEventListener("error", () => {
  status.textContent = "音樂載入失敗，請稍後再試。";
});
</script>

</body>
</html>
